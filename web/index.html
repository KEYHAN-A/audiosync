<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AudioSync Pro — WebAssembly Demo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #050816;
      --card: rgba(255,255,255,0.05);
      --border: rgba(255,255,255,0.1);
      --text: #e2e8f0;
      --text-dim: #94a3b8;
      --cyan: #38bdf8;
      --purple: #a78bfa;
      --green: #4ade80;
      --red: #f87171;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem;
      overflow-x: hidden;
    }

    .glow-orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.15;
      pointer-events: none;
      z-index: 0;
    }
    .glow-orb.cyan { width: 400px; height: 400px; background: var(--cyan); top: -100px; right: -100px; }
    .glow-orb.purple { width: 300px; height: 300px; background: var(--purple); bottom: -50px; left: -50px; }

    .container {
      position: relative;
      z-index: 1;
      max-width: 800px;
      width: 100%;
    }

    h1 {
      font-size: 2rem;
      font-weight: 800;
      text-align: center;
      margin-bottom: 0.5rem;
    }
    h1 span { color: var(--cyan); }

    .subtitle {
      text-align: center;
      color: var(--text-dim);
      margin-bottom: 2rem;
    }

    .badge {
      display: inline-block;
      background: linear-gradient(135deg, var(--cyan), var(--purple));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      font-weight: 700;
      font-size: 0.8rem;
      padding: 0.25rem 0.75rem;
      border-radius: 9999px;
      letter-spacing: 0.05em;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1.5rem;
      margin-bottom: 1rem;
      backdrop-filter: blur(12px);
    }

    .drop-zone {
      border: 2px dashed var(--border);
      border-radius: 12px;
      padding: 2rem;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
    }
    .drop-zone:hover, .drop-zone.drag-over {
      border-color: var(--cyan);
      background: rgba(56, 189, 248, 0.05);
    }
    .drop-zone p { color: var(--text-dim); margin-top: 0.5rem; }

    .track-list { list-style: none; }
    .track-item {
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.75rem 1rem;
      margin-bottom: 0.5rem;
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    .track-name { font-weight: 600; color: var(--cyan); min-width: 120px; }
    .clip-info { color: var(--text-dim); font-size: 0.85rem; }

    .waveform-canvas {
      width: 100%;
      height: 60px;
      border-radius: 6px;
      background: rgba(0,0,0,0.3);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.65rem 1.5rem;
      border: none;
      border-radius: 10px;
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-primary {
      background: linear-gradient(135deg, var(--cyan), #0ea5e9);
      color: #050816;
    }
    .btn-primary:hover { filter: brightness(1.1); transform: translateY(-1px); }
    .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
    .btn-secondary {
      background: rgba(255,255,255,0.08);
      color: var(--text);
      border: 1px solid var(--border);
    }
    .btn-secondary:hover { background: rgba(255,255,255,0.12); }

    .btn-row { display: flex; gap: 0.75rem; margin-top: 1rem; flex-wrap: wrap; }

    .status-bar {
      margin-top: 1rem;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 500;
    }
    .status-bar.info { background: rgba(56,189,248,0.1); color: var(--cyan); }
    .status-bar.success { background: rgba(74,222,128,0.1); color: var(--green); }
    .status-bar.error { background: rgba(248,113,113,0.1); color: var(--red); }

    .result-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 1rem;
      margin-top: 1rem;
    }
    .stat-card {
      background: rgba(255,255,255,0.03);
      border-radius: 8px;
      padding: 1rem;
      text-align: center;
    }
    .stat-value { font-size: 1.5rem; font-weight: 700; color: var(--cyan); }
    .stat-label { font-size: 0.75rem; color: var(--text-dim); margin-top: 0.25rem; }

    .version-tag {
      position: fixed;
      bottom: 1rem;
      right: 1rem;
      color: var(--text-dim);
      font-size: 0.75rem;
    }

    .spinner {
      display: inline-block;
      width: 16px; height: 16px;
      border: 2px solid var(--border);
      border-top-color: var(--cyan);
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    #file-input { display: none; }
  </style>
</head>
<body>
  <div class="glow-orb cyan"></div>
  <div class="glow-orb purple"></div>

  <div class="container">
    <h1>Audio<span>Sync</span> Pro</h1>
    <p class="subtitle">
      <span class="badge">WASM DEMO</span><br><br>
      Multi-device audio synchronization — running entirely in your browser via WebAssembly
    </p>

    <div class="card">
      <h3 style="margin-bottom: 0.75rem;">Import Audio Files</h3>
      <div class="drop-zone" id="drop-zone">
        <div style="font-size: 2rem;">&#127925;</div>
        <p><strong>Drop WAV files here</strong></p>
        <p style="font-size: 0.8rem;">or click to browse — supports 16/24/32-bit WAV</p>
      </div>
      <input type="file" id="file-input" multiple accept=".wav,.aiff,.aif,.flac" />
    </div>

    <div class="card" id="tracks-card" style="display: none;">
      <h3 style="margin-bottom: 0.75rem;">Tracks</h3>
      <ul class="track-list" id="track-list"></ul>
      <div class="btn-row">
        <button class="btn btn-primary" id="analyze-btn" disabled>Analyze</button>
        <button class="btn btn-secondary" id="reset-btn">Reset</button>
      </div>
    </div>

    <div id="status-area"></div>

    <div class="card" id="result-card" style="display: none;">
      <h3 style="margin-bottom: 0.75rem;">Analysis Result</h3>
      <div class="result-grid" id="result-grid"></div>
      <ul class="track-list" id="result-tracks" style="margin-top: 1rem;"></ul>
    </div>
  </div>

  <div class="version-tag" id="version"></div>

  <script type="module">
    // Load the WASM module
    const wasm = await import("../audiosync-wasm/pkg/audiosync_wasm.js");
    const engine = new wasm.WasmSyncEngine();

    // Version
    document.getElementById("version").textContent = "v" + engine.version();

    // DOM refs
    const dropZone = document.getElementById("drop-zone");
    const fileInput = document.getElementById("file-input");
    const tracksCard = document.getElementById("tracks-card");
    const trackList = document.getElementById("track-list");
    const analyzeBtn = document.getElementById("analyze-btn");
    const resetBtn = document.getElementById("reset-btn");
    const resultCard = document.getElementById("result-card");
    const resultGrid = document.getElementById("result-grid");
    const resultTracks = document.getElementById("result-tracks");
    const statusArea = document.getElementById("status-area");

    function showStatus(msg, type = "info") {
      statusArea.innerHTML = `<div class="status-bar ${type}">${msg}</div>`;
    }
    function clearStatus() { statusArea.innerHTML = ""; }

    // File handling
    dropZone.addEventListener("click", () => fileInput.click());
    dropZone.addEventListener("dragover", (e) => {
      e.preventDefault();
      dropZone.classList.add("drag-over");
    });
    dropZone.addEventListener("dragleave", () => dropZone.classList.remove("drag-over"));
    dropZone.addEventListener("drop", (e) => {
      e.preventDefault();
      dropZone.classList.remove("drag-over");
      handleFiles(e.dataTransfer.files);
    });
    fileInput.addEventListener("change", (e) => handleFiles(e.target.files));

    async function handleFiles(files) {
      if (!files.length) return;

      clearStatus();
      showStatus(`<span class="spinner"></span> Loading ${files.length} file(s)...`);

      let loaded = 0;
      for (const file of files) {
        try {
          const buffer = await file.arrayBuffer();
          const data = new Uint8Array(buffer);
          engine.load_clip_from_bytes(file.name, data);
          loaded++;
        } catch (e) {
          console.error(`Failed to load ${file.name}:`, e);
          showStatus(`Error loading ${file.name}: ${e}`, "error");
          return;
        }
      }

      showStatus(`Loaded ${loaded} file(s) in ${engine.track_count()} track(s)`, "success");
      refreshTracks();
    }

    function refreshTracks() {
      const tracks = JSON.parse(engine.get_tracks());
      if (tracks.length === 0) {
        tracksCard.style.display = "none";
        resultCard.style.display = "none";
        return;
      }

      tracksCard.style.display = "";
      trackList.innerHTML = "";

      tracks.forEach((track) => {
        const li = document.createElement("li");
        li.className = "track-item";
        const clipDetails = track.clips.map((c) =>
          `<span class="clip-info">${c.name} (${c.duration_s.toFixed(1)}s)</span>`
        ).join("");
        li.innerHTML = `
          <span class="track-name">${track.name}</span>
          <div style="flex:1; display:flex; gap:0.5rem; flex-wrap:wrap;">${clipDetails}</div>
        `;
        trackList.appendChild(li);
      });

      analyzeBtn.disabled = false;
    }

    // Analyze
    analyzeBtn.addEventListener("click", () => {
      try {
        showStatus(`<span class="spinner"></span> Running FFT cross-correlation...`);
        const result = JSON.parse(engine.analyze());

        resultCard.style.display = "";
        resultGrid.innerHTML = `
          <div class="stat-card">
            <div class="stat-value">${result.tracks.length}</div>
            <div class="stat-label">Tracks</div>
          </div>
          <div class="stat-card">
            <div class="stat-value">${result.avg_confidence.toFixed(1)}</div>
            <div class="stat-label">Avg Confidence</div>
          </div>
          <div class="stat-card">
            <div class="stat-value">${result.total_timeline_s.toFixed(1)}s</div>
            <div class="stat-label">Timeline</div>
          </div>
          <div class="stat-card">
            <div class="stat-value">${result.drift_detected ? "Yes" : "No"}</div>
            <div class="stat-label">Drift</div>
          </div>
        `;

        resultTracks.innerHTML = "";
        result.tracks.forEach((track) => {
          const li = document.createElement("li");
          li.className = "track-item";
          const clipDetails = track.clips.map((c) => {
            const confColor = c.confidence > 3 ? "var(--green)" : c.confidence > 0 ? "var(--red)" : "var(--text-dim)";
            return `<span class="clip-info" style="color:${confColor}">
              ${c.name} — offset: ${c.timeline_offset_s.toFixed(3)}s, conf: ${c.confidence.toFixed(1)}
            </span>`;
          }).join("");
          const refBadge = track.is_reference
            ? '<span style="color:var(--purple);font-size:0.7rem;font-weight:700;">REF</span>'
            : "";
          li.innerHTML = `
            <span class="track-name">${track.name} ${refBadge}</span>
            <div style="flex:1; display:flex; gap:0.5rem; flex-wrap:wrap;">${clipDetails}</div>
          `;
          resultTracks.appendChild(li);
        });

        if (result.warnings.length > 0) {
          showStatus(`Analysis complete with warnings: ${result.warnings.join(", ")}`, "info");
        } else {
          showStatus("Analysis complete", "success");
        }

        // Refresh track list with updated offsets
        refreshTracks();
      } catch (e) {
        showStatus(`Analysis failed: ${e}`, "error");
      }
    });

    // Reset
    resetBtn.addEventListener("click", () => {
      engine.reset();
      tracksCard.style.display = "none";
      resultCard.style.display = "none";
      clearStatus();
      fileInput.value = "";
    });
  </script>
</body>
</html>
