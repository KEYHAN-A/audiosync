[package]
name = "audiosync-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Core audio synchronization engine — FFT cross-correlation, drift detection, audio I/O"

[features]
default = ["audio-io", "cloud", "export", "project", "validation", "logging", "testing", "chrono"]
audio-io = ["dep:symphonia", "dep:hound", "dep:rubato", "dep:dirs", "dep:uuid"]
cloud = ["dep:reqwest", "dep:tokio"]
export = ["dep:quick-xml", "audio-io"]
project = []
validation = []
logging = ["dep:tracing-subscriber", "dep:tracing-appender"]
testing = ["dep:proptest", "dep:rstest"]
chrono = ["dep:chrono"]

[dependencies]
# FFT
rustfft = "6"

# Arrays
ndarray = "0.16"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# HTTP client (for cloud) — optional, not needed for WASM
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false, optional = true }

# Async — optional, not needed for WASM
tokio = { version = "1", features = ["rt", "sync", "macros"], optional = true }

# Audio I/O — optional for WASM builds
symphonia = { version = "0.5", features = ["all"], optional = true }
hound = { version = "3", optional = true }
rubato = { version = "0.16", optional = true }

# XML generation (FCPXML export) — optional
quick-xml = { version = "0.37", features = ["serialize"], optional = true }

# Platform directories — optional for WASM
dirs = { version = "6", optional = true }

# Regex (grouping)
regex = "1"

# Logging
log = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"], optional = true }
tracing-appender = { version = "0.2", optional = true }

# Error handling
thiserror = "2"
anyhow = "1"

# Testing — dev-only, not needed for WASM
proptest = { version = "1", optional = true }
rstest = { version = "0.23", optional = true }

# Parallel processing — unused, kept for future use
rayon = { version = "1", optional = true }

# Progress reporting
indicatif = { version = "0.17", optional = true }

# UUID (session IDs for cache) — optional, not needed for WASM
uuid = { version = "1", features = ["v4"], optional = true }

# Time
chrono = { version = "0.4", features = ["serde"], optional = true }
